name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m flake8 src tests examples
      - name: Fast test suite
        run: python -m pytest -m "not slow" --cov=policyscope --cov-report=term-missing

  validation:
    name: statistical validation (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plots]"
      - name: Slow statistical checks
        run: python -m pytest -m slow --durations=10
      - name: Simulation validation harness
        run: |
          python examples/run_validation_experiment.py \
            --n-runs 12 --n-users 1500 --n-boot 100 \
            --artifacts-dir validation_artifacts --strict
      - name: End-to-end synthetic example
        run: |
          python examples/run_synthetic_experiment.py \
            --n-users 5000 --n-boot 100 --artifacts-dir synthetic_artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            validation_artifacts
            synthetic_artifacts
