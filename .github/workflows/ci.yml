name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"  # раз в неделю: ловим поломки от новых версий зависимостей
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m flake8 src tests examples
      - name: Fast tests
        run: python -m pytest -m "not slow" --cov=policyscope --cov-report=term-missing

  min-deps:
    name: tests (minimum dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install declared lower bounds
        run: |
          python -m pip install numpy==1.23.5 pandas==1.5.3 scikit-learn==1.2.2 scipy==1.9.3 \
            joblib==1.2.0 threadpoolctl==3.5.0 pytest
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Fast tests
        run: python -m pytest -m "not slow"

  package:
    name: build and test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "policyscope/py.typed" in names, "py.typed missing"
          top = {n.split("/")[0] for n in names}
          extra = {t for t in top if t != "policyscope" and not t.endswith(".dist-info")}
          assert not extra, f"unexpected top-level entries: {extra}"
          EOF
      - name: Test against the installed wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install dist/*.whl pytest
          /tmp/wheelenv/bin/python -m pip check
          /tmp/wheelenv/bin/python -c "import importlib.metadata as m, policyscope as p; assert p.__version__ == m.version('policyscope'), p.__file__"
          /tmp/wheelenv/bin/python -m pytest -o pythonpath= -m "not slow"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  statistical:
    name: statistical validation (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Slow statistical tests
        run: python -m pytest -m slow --durations=10
      - name: Validation scenarios
        run: python examples/validate.py --runs 30 --clients 2000 --n-boot 60 --output validation.md --strict
      - name: Tutorial executes
        run: python -m jupyter nbconvert --to notebook --execute --output /tmp/tutorial.ipynb examples/tutorial.ipynb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation.md
