[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "policyscope"
version = "0.2.0"
description = "Инструменты оффлайн‑оценки рекомендательных моделей (IPS/SNIPS/DM/DR/SNDR/Switch-DR) на синтетике и логах"
readme = "README.md"
authors = [{name = "OffPolicyLab"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scikit-learn>=1.1",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
]
plots = [
    "matplotlib>=3.5",
]
notebook = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
policyscope = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: медленные статистические проверки (покрытие CI, состоятельность); запускаются отдельной job в CI",
]
