[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "policyscope"
version = "0.3.0"
description = "Офлайн-оценка политик рекомендаций (off-policy evaluation) по логам: DR/IPS/SNDR, честные интервалы и диагностика доверия"
readme = "README.md"
authors = [{name = "OffPolicyLab"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "joblib>=1.2",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "matplotlib>=3.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
policyscope = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: статистические проверки на многих симуляциях (несмещённость, покрытие ДИ)",
]

[tool.flake8]
max-line-length = 120
